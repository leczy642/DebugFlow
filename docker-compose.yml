version: "3.9"

services:
  backend:
    build: ./backend
    container_name: debugflow-backend
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    # 👇 Fix: keep node_modules inside container
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    environment:
      - NODE_ENV=development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: debugflow-frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
      - NODE_ENV=development
    ports:
      - "3000:3000"
    # 👇 Same pattern for frontend (prevents wiping .next and node_modules)
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
